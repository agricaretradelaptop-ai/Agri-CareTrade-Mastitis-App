workflows:
  android-test-build:
    name: Agri Mastitis Android Test
    max_build_duration: 30
    environment:
      java: 21
    scripts:
      - name: Create Gradle 9 wrapper
        script: |
          set -e
          rm -rf /tmp/agri-gradle-wrapper
          mkdir -p /tmp/agri-gradle-wrapper
          cd /tmp/agri-gradle-wrapper
          touch settings.gradle
          touch build.gradle
          gradle wrapper --gradle-version 9.3.0 --distribution-type bin
          cp gradlew "$CM_BUILD_DIR/gradlew"
          cp gradlew.bat "$CM_BUILD_DIR/gradlew.bat"
          rm -rf "$CM_BUILD_DIR/gradle"
          cp -R gradle "$CM_BUILD_DIR/gradle"
          cd "$CM_BUILD_DIR"
          chmod +x gradlew
          ./gradlew --version
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-playstore-aab:
    name: Agri Mastitis Play Store AAB
    max_build_duration: 30
    environment:
      java: 21
    scripts:
      - name: Create Gradle 9 wrapper
        script: |
          set -e
          rm -rf /tmp/agri-gradle-wrapper
          mkdir -p /tmp/agri-gradle-wrapper
          cd /tmp/agri-gradle-wrapper
          touch settings.gradle
          touch build.gradle
          gradle wrapper --gradle-version 9.3.0 --distribution-type bin
          cp gradlew "$CM_BUILD_DIR/gradlew"
          cp gradlew.bat "$CM_BUILD_DIR/gradlew.bat"
          rm -rf "$CM_BUILD_DIR/gradle"
          cp -R gradle "$CM_BUILD_DIR/gradle"
          cd "$CM_BUILD_DIR"
          chmod +x gradlew
          ./gradlew --version
      - name: Build release AAB
        script: |
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
