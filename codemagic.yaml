workflows:
  android-test-build:
    name: Agri Mastitis Android Test
    max_build_duration: 30
    environment:
      java: 21
    scripts:
      - name: Create Gradle 9 wrapper
        script: |
          rm -rf /tmp/agri-gradle-wrapper
          mkdir -p /tmp/agri-gradle-wrapper
          cat > /tmp/agri-gradle-wrapper/build.gradle <<'EOF'
          tasks.register("wrapper", Wrapper) {
              gradleVersion = "9.3.0"
              distributionType = Wrapper.DistributionType.BIN
          }
          EOF
          gradle -p /tmp/agri-gradle-wrapper wrapper --no-daemon
          cp -R /tmp/agri-gradle-wrapper/gradle ./gradle
          cp /tmp/agri-gradle-wrapper/gradlew ./gradlew
          cp /tmp/agri-gradle-wrapper/gradlew.bat ./gradlew.bat
          chmod +x ./gradlew
          ./gradlew --version
      - name: Build debug APK
        script: |
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-playstore-aab:
    name: Agri Mastitis Play Store AAB
    max_build_duration: 30
    environment:
      java: 21
    scripts:
      - name: Create Gradle 9 wrapper
        script: |
          rm -rf /tmp/agri-gradle-wrapper
          mkdir -p /tmp/agri-gradle-wrapper
          cat > /tmp/agri-gradle-wrapper/build.gradle <<'EOF'
          tasks.register("wrapper", Wrapper) {
              gradleVersion = "9.3.0"
              distributionType = Wrapper.DistributionType.BIN
          }
          EOF
          gradle -p /tmp/agri-gradle-wrapper wrapper --no-daemon
          cp -R /tmp/agri-gradle-wrapper/gradle ./gradle
          cp /tmp/agri-gradle-wrapper/gradlew ./gradlew
          cp /tmp/agri-gradle-wrapper/gradlew.bat ./gradlew.bat
          chmod +x ./gradlew
          ./gradlew --version
      - name: Build release AAB
        script: |
          ./gradlew bundleRelease --stacktrace
    artifacts:
      - app/build/outputs/bundle/release/*.aab
